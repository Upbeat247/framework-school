    { label:'Interview — handling pressure', prompt:'"Tell me about a time you worked under pressure."',
      lines:[
        {el:'Situation', c:'var(--teal)', t:'Two days before a planned shutdown, a routine survey found wall loss on a line that was not in the scope.'},
        {el:'Task', c:'var(--orange)', t:'I had to decide, as the responsible inspection engineer, whether to add it to the scope — which meant pushing back the start — or let it run another cycle.'},
        {el:'Action', c:'var(--gold)', t:'I pulled the last three inspection records that night and modelled the corrosion rate rather than relying on the single reading. I found the rate had doubled after a process change nobody had flagged to us. I took that to the shutdown manager with two costed options rather than just a concern, and I recommended adding it.'},
        {el:'Result', c:'var(--blue)', t:'We added it and lost half a day. When we opened it the remaining wall was below what the single reading suggested, so leaving it would very likely have meant a leak before the next window. I now pull trend data before escalating anything, rather than reacting to one reading.'}
      ]},
    { label:'Interview — conflict', prompt:'"Tell me about a disagreement with a colleague."',
      lines:[
        {el:'Situation', c:'var(--teal)', t:'A contractor lead and I disagreed on whether a weld repair needed full re-radiography.'},
        {el:'Task', c:'var(--orange)', t:'I owned the acceptance decision, so it was my call — but I needed his crew to execute it willingly, not resentfully.'},
        {el:'Action', c:'var(--gold)', t:'Instead of asserting the standard, I asked him to walk me through his reasoning first, and it turned out he was working from a superseded procedure. I showed him the current clause, agreed a partial re-shoot rather than the full scope he feared, and let him present that compromise to his own crew so it did not look imposed.'},
        {el:'Result', c:'var(--blue)', t:'The repair was re-shot and accepted the same shift. He has come to me first on grey-area calls ever since. I learned that checking which version of a procedure someone is holding resolves more disputes than arguing about the content.'}
      ]},
    { label:'Performance review', prompt:'"What is your biggest contribution this year?"',
      lines:[
        {el:'Situation', c:'var(--teal)', t:'Our inspection planning was fixed-interval, so we were opening equipment on a calendar rather than on risk.'},
        {el:'Task', c:'var(--orange)', t:'Nobody owned changing it. I took it on alongside my normal scope.'},
        {el:'Action', c:'var(--gold)', t:'I built a corrosion-rate model from six years of our own readings, ranked every circuit by remaining life, and — because I knew the argument would be won or lost on cost, not on engineering — I framed the proposal around scaffold spend rather than integrity theory.'},
        {el:'Result', c:'var(--blue)', t:'We moved to risk-based intervals on eleven circuits and cut about a third of the scaffold budget, with no increase in findings. The lesson for me was that a technical case has to be argued in the currency of whoever signs it off.'}
      ]},
    { label:'Outside work', prompt:'"Tell me about a time you led something informally."',
      lines:[
        {el:'Situation', c:'var(--teal)', t:'Our street had flooded twice and nobody had approached the council.'},
        {el:'Task', c:'var(--orange)', t:'I decided to put a case together myself rather than wait for someone official to do it.'},
        {el:'Action', c:'var(--gold)', t:'I photographed the drains after each event, collected dates from eleven households so it was a pattern rather than a complaint, and wrote a single page ending with a specific ask instead of a general grievance.'},
        {el:'Result', c:'var(--blue)', t:'The drains were cleared within six weeks and added to a quarterly schedule. It taught me that a documented pattern plus one specific ask moves institutions that complaints do not.'}
      ]}
  ],
  weakStrong:{
    prompt:'"Tell me about a time you worked under pressure."',
    weak:'So this was during a shutdown a couple of years ago. It was a big one — about four hundred contractors on site, lots of scopes running at once, and there had been some issues in the planning phase, plus the weather was against us. Anyway, we found a problem on a line, and we had to decide what to do. We discussed it as a team and we agreed to add it to the scope. It worked out okay in the end.',
    weakWhy:'Three-quarters of the answer is scene-setting that demonstrates nothing. The Task is never stated as yours. The Action is "we discussed and we agreed" — the interviewer learns that a meeting happened, not that you can think. And the Result is "okay in the end", which is not an outcome.',
    strong:'Two days before a shutdown, a survey found wall loss on a line outside the scope. As the responsible inspection engineer, the call was mine: add it and delay the start, or let it run. I pulled three years of records that night and modelled the rate rather than trusting one reading — it had doubled after an unflagged process change. I took the shutdown manager two costed options and recommended adding it. We lost half a day; when we opened it, the wall was thinner than the single reading suggested, so leaving it would likely have meant a leak. I now pull trend data before escalating anything.',
    strongWhy:'Setup in two sentences. The task is explicitly owned. The Action is first-person and shows reasoning, not just activity — including the judgement to bring options rather than a problem. The Result is concrete, states the counterfactual, and ends on a transferable lesson.'
  },
  questions:[
    /* --- SITUATION --- */
    { id:'s1', el:'situation', check:true,
      stem:'What proportion of a STAR answer should the Situation take?',
      opts:[
        {t:'About half — the listener needs full context to judge the story.', w:'This is the instinct that ruins most STAR answers. Context is not what is being assessed, and half your airtime spent on it leaves nothing for what is.'},
        {t:'One or two sentences — enough for the story to make sense.', w:'Setup should be minimal. Situation and Task together are roughly a quarter of the answer; Action and Result are the rest.'},
        {t:'As long as needed — there is no rule.', w:'There is no hard rule, but "as long as needed" is how candidates talk themselves into three minutes of preamble.'},
        {t:'It can be skipped entirely.', w:'Without any scene the story floats. One or two sentences is the target, not zero.'}
      ], a:1, take:'Setup is a quarter. Action and Result are the answer.' },

    { id:'s2', el:'situation', check:true,
      stem:'Why do nervous candidates over-invest in the Situation?',
      opts:[
        {t:'They think detail demonstrates thoroughness.', w:'Some believe this, but it is not the underlying driver.'},
        {t:'Scene-setting requires no self-assertion, so it feels safe.', w:'Describing circumstances makes no claim about you, so there is nothing to be judged on. It is the comfortable part — which is exactly why it expands to fill the time you needed for evidence.'},
        {t:'They have not prepared the rest of the answer.', w:'Sometimes true, but well-prepared candidates do it too.'},
        {t:'Interviewers usually ask for more context.', w:'They rarely do. Interviewers almost always want you to get to the action faster.'}
      ], a:1, take:'You hide in the Situation because nothing there can be judged.' },

    { id:'s3', el:'situation', check:true,
      stem:'Which Situation is correctly sized?',
      opts:[
        {t:'"It was a large shutdown — four hundred contractors, multiple scopes, planning had been difficult, and the weather was poor that month."', w:'Four pieces of colour, none of which the story will use. Detail that never becomes relevant is pure cost.'},
        {t:'"Two days before a planned shutdown, a routine survey found wall loss on a line that was not in the scope."', w:'One sentence establishing timing, stakes and the specific trigger. Everything in it is load-bearing.'},
        {t:'"There was a problem during a shutdown."', w:'Too thin — no stakes, no timing, nothing to make the story land.'},
        {t:'"I should explain a bit about how our inspection planning cycle works first."', w:'A preamble to the preamble. If the framework needs explaining, weave it into the Action instead.'}
      ], a:1, take:'Every sentence of setup must be used later. If not, cut it.' },

    { id:'s4', el:'situation', check:true,
      stem:'The interviewer says "you can skip the background, just tell me what you did." What has happened?',
      opts:[
        {t:'They are being rude and you should continue as planned.', w:'They are not being rude — they are telling you exactly how to score better. Ignoring it wastes a gift.'},
        {t:'They are telling you your Situation has run long and the assessable part has not started.', w:'That sentence is a scoring signal. The interviewer needs Action and Result to fill their form, and you have not given them any yet. Jump immediately.'},
        {t:'They already know the context from your CV.', w:'Occasionally true, but the instruction is about your pacing, not their knowledge.'},
        {t:'They are short of time in the interview overall.', w:'Sometimes — but the fix is the same, and the message is about where your answer is weighted.'}
      ], a:1, take:'"Just tell me what you did" means: you are still in the setup.' },

    { id:'s5', el:'situation',
      stem:'Which detail belongs in the Situation of a story about a disputed weld repair?',
      opts:[
        {t:'The contractor company\'s full name and contract history.', w:'Irrelevant to the judgement being assessed, and it burns your scarce setup sentences.'},
        {t:'That you owned the acceptance decision but needed his crew to execute willingly.', w:'This is the tension the whole story turns on — though strictly it belongs in the Task slot, where the ownership is stated.'},
        {t:'That a contractor lead and you disagreed on whether a repair needed full re-radiography.', w:'One sentence, names the conflict, sets up everything that follows. Exactly the right size and content.'},
        {t:'A summary of the relevant radiography standard.', w:'Technical background the listener does not need to follow the human story.'}
      ], a:2, take:'Setup names the tension. It does not explain the industry.' },

    /* --- TASK --- */
    { id:'t1', el:'task', check:true,
      stem:'Which is a correctly stated Task?',
      opts:[
        {t:'"We needed to decide whether to add the line to the shutdown scope."', w:'The team\'s objective. The interviewer still does not know what you personally owned, which is the only thing the slot exists to establish.'},
        {t:'"As the responsible inspection engineer, the call was mine: add it and delay the start, or let it run."', w:'Names your role, your ownership, and the specific decision — so everything in the Action now clearly belongs to you.'},
        {t:'"The task was to make sure the shutdown was safe and successful."', w:'A mission statement rather than a task. Nothing here distinguishes your responsibility from anyone else\'s.'},
        {t:'"There was a lot riding on getting it right."', w:'Stakes, not task. It says the situation mattered, not what you were accountable for.'}
      ], a:1, take:'Task = what YOU owned, stated explicitly.' },

    { id:'t2', el:'task', check:true,
      stem:'What is the difference between Situation and Task?',
      opts:[
        {t:'Situation is background; Task is your specific responsibility within it.', w:'Situation is the world. Task is your job in that world — and the shift from third person to first person should happen right here.'},
        {t:'Situation is what happened; Task is what you did about it.', w:'What you did is the Action. Task is what you were responsible for before you did anything.'},
        {t:'Situation is long; Task is short.', w:'Both should be short. Length is not the distinction.'},
        {t:'They are interchangeable in practice.', w:'Collapsing them is the common shortcut, and it is how ownership disappears from the answer.'}
      ], a:0, take:'Situation is the world. Task is your job in it.' },

    { id:'t3', el:'task', check:true,
      stem:'You were one of four people working on something. How should the Task be stated?',
      opts:[
        {t:'"The four of us were tasked with delivering the review."', w:'Honest and useless for assessment. A quarter share of an unspecified task is unmeasurable.'},
        {t:'"I owned the corrosion assessment; the other three covered process, mechanical and cost."', w:'Honest about the team AND specific about your slice. Naming what others owned makes your own boundary credible rather than boastful.'},
        {t:'"I led the whole review."', w:'If untrue, this is the fastest way to be caught — one follow-up question about a colleague\'s workstream and it collapses.'},
        {t:'"We each had our own areas of responsibility."', w:'Names the structure without naming yours. The interviewer still cannot assess you.'}
      ], a:1, take:'Name your slice — and what others owned. It makes you credible.' },

    { id:'t4', el:'task', check:true,
      stem:'Which Task statement quietly weakens the whole answer?',
      opts:[
        {t:'"I had to decide whether to escalate it."', w:'Clear ownership of a real decision.'},
        {t:'"I was asked to look into it and report back."', w:'Technically a task, but framed as pure instruction-following: no judgement, no discretion, no accountability. Everything you describe afterwards will read as compliance rather than initiative — which is why it is the subtle one.'},
        {t:'"I was accountable for the sign-off, so the risk sat with me."', w:'Strong — names accountability and consequence.'},
        {t:'"Nobody owned it, so I took it on alongside my normal scope."', w:'Excellent — initiative plus ownership.'}
      ], a:1, take:'"Asked to look into it" frames you as an errand, not an engineer.' },

    { id:'t5', el:'task',
      stem:'When is it legitimate to spend a little longer on the Task?',
      opts:[
        {t:'When the task itself was unusually difficult to define.', w:'When the real work was working out what the job even was, the Task slot is carrying genuine content — an ambiguous brief you had to shape is itself evidence of seniority.'},
        {t:'When you want to show how senior you are.', w:'Seniority shows through the Action. Inflating the Task reads as positioning.'},
        {t:'When the Situation was short.', w:'Budget does not transfer between slots. A short Situation should leave more room for Action.'},
        {t:'When the result was disappointing.', w:'Padding the setup to soften a weak outcome is transparent and makes it worse.'}
      ], a:0, take:'If defining the task WAS the work, say so — that is senior evidence.' },

    /* --- ACTION --- */
    { id:'a1', el:'action', check:true,
      stem:'What is the single most damaging word in the Action slot?',
      opts:[
        {t:'"Tried" — it implies you failed.', w:'"Tried" is weak, but honest attempts are perfectly assessable.'},
        {t:'"We" — the interviewer cannot assess a team.', w:'Every "we" hides the boundary between your contribution and everyone else\'s. Interviewers score individuals, so a "we" sentence contributes almost nothing to your evidence.'},
        {t:'"Just" — it minimises your contribution.', w:'A real hedge, but it damages tone rather than erasing evidence.'},
        {t:'"Quickly" — it suggests you rushed.', w:'Usually reads as decisive, not careless.'}
      ], a:1, take:'Count your "we"s. Each one is a sentence that did not score.' },

    { id:'a2', el:'action', check:true,
      stem:'Which Action is strongest?',
      opts:[
        {t:'"We got the team together, discussed the options, and agreed on the best way forward."', w:'A meeting happened. No decision is attributable, no reasoning is visible, and the candidate could have been silent throughout.'},
        {t:'"I pulled three years of records that night and modelled the rate rather than trusting the single reading, because one point cannot show a trend. When it showed the rate had doubled, I took the manager two costed options and recommended one."', w:'First person, specific, and it shows the reasoning behind each choice — including the judgement to arrive with options rather than a problem. That is what "thinks like a senior engineer" looks like in evidence.'},
        {t:'"I immediately escalated it to my manager as per procedure."', w:'Correct and utterly uninformative. Following a procedure shows compliance, not judgement.'},
        {t:'"I worked extremely hard on it, often late into the evening, to make sure it was right."', w:'Effort, not action. Hours worked is not a decision made.'}
      ], a:1, take:'Show the reasoning, not just the activity. Reasoning is what is being scored.' },

    { id:'a3', el:'action', check:true,
      stem:'You genuinely did the work as part of a team. How do you avoid dishonesty while still using "I"?',
      opts:[
        {t:'Use "we" throughout — honesty matters more than scoring.', w:'A false dichotomy. You can be scrupulously honest and still specify your own contribution.'},
        {t:'Attribute the team\'s work to yourself for the interview.', w:'Dishonest and fragile — one probing follow-up exposes it.'},
        {t:'Say "we" for the shared frame, then "I" for your specific contributions within it.', w:'"We agreed to re-sequence; I built the model that showed which circuits to drop." Accurate about the team, precise about you. Honesty and evidence are not in conflict.'},
        {t:'Avoid pronouns by using passive voice.', w:'"It was decided that…" removes agency entirely and is worse than "we".'}
      ], a:2, take:'"We" for the frame, "I" for your moves inside it.' },

    { id:'a4', el:'action', check:true,
      stem:'Which Action detail is most worth including?',
      opts:[
        {t:'The chronological order of every step you took.', w:'A sequence of activities. Interviewers glaze over and learn nothing about your thinking.'},
        {t:'The one choice where you could have gone another way, and why you chose as you did.', w:'The decision point is the entire assessable moment. Anyone can follow a process — what distinguishes you is the fork and the reasoning at it.'},
        {t:'How many hours you put in.', w:'Effort, not judgement.'},
        {t:'Which software or tools you used.', w:'Occasionally relevant for a technical screen, rarely the thing being assessed.'}
      ], a:1, take:'Find the fork in the story and explain why you went right.' },

    { id:'a5', el:'action',
      stem:'Your Action involved a mistake you later corrected. Include it?',
      opts:[
        {t:'No — never volunteer errors in an interview.', w:'This instinct costs strong candidates a lot. A corrected mistake is usually the most convincing part of a story, because it is the part nobody invents.'},
        {t:'Yes, if you also show how you detected and corrected it.', w:'It demonstrates self-monitoring, which is genuinely hard to fake and highly valued. The evidence is not "I never err" — it is "I catch it".'},
        {t:'Only if the interviewer asks directly.', w:'Waiting to be asked means it reads as an admission rather than as self-awareness.'},
        {t:'Yes, and attribute it to circumstances beyond your control.', w:'Deflecting the cause destroys the very credibility the admission would have earned.'}
      ], a:1, take:'A caught-and-corrected mistake is evidence nobody can fake.' },

    /* --- RESULT --- */
    { id:'r1', el:'result', check:true,
      stem:'Which Result is strongest?',
      opts:[
        {t:'"It worked out well and everyone was happy with the outcome."', w:'Nothing measurable, nothing checkable. This is the most common STAR ending and it scores close to zero.'},
        {t:'"We lost half a day. When we opened it, the wall was thinner than the single reading suggested — leaving it would very likely have meant a leak before the next window."', w:'A quantified cost, a concrete finding, and the counterfactual that proves the decision was right. The counterfactual is what turns an outcome into vindication.'},
        {t:'"The shutdown was completed successfully."', w:'Reports that the project ended, not what your action achieved.'},
        {t:'"My manager was very pleased with how I handled it."', w:'Second-hand praise instead of an outcome. It also puts your evidence in someone else\'s mouth.'}
      ], a:1, take:'State the counterfactual: what would have happened if you had not acted.' },

    { id:'r2', el:'result', check:true,
      stem:'You have no numbers for the Result. What is the best substitute?',
      opts:[
        {t:'Say it went well and move on.', w:'The weakest possible ending — and it is where most unquantified answers land.'},
        {t:'A concrete observable change, or the counterfactual.', w:'"He has come to me first on grey-area calls ever since" is unquantified and entirely concrete. So is "leaving it would have meant a leak". Specificity, not arithmetic.'},
        {t:'Estimate a number so it sounds rigorous.', w:'Never invent figures. One challenged number destroys the whole answer.'},
        {t:'Describe how the team felt afterwards.', w:'Sentiment is the softest available evidence and usually reads as filler.'}
      ], a:1, take:'No numbers? Use a concrete change — or the counterfactual.' },

    { id:'r3', el:'result', check:true,
      stem:'What should follow the outcome in a strong Result?',
      opts:[
        {t:'A brief statement of what you now do differently.', w:'The lesson converts one story into a claim about your future behaviour — which is the thing the interviewer is actually trying to predict. It is the highest-value sentence in the whole answer.'},
        {t:'An acknowledgement of who else helped.', w:'Gracious, and it dilutes the one moment the answer is entirely yours. Credit others in the Action.'},
        {t:'A summary of the situation to close the loop.', w:'Re-stating context at the end wastes the strongest position in the answer.'},
        {t:'An offer to give another example.', w:'Let the interviewer manage their own agenda.'}
      ], a:0, take:'End on what you do differently now. That is the predictive bit.' },

    { id:'r4', el:'result', check:true,
      stem:'The outcome was genuinely poor. What is the best Result?',
      opts:[
        {t:'Choose a different story with a better outcome.', w:'Often sensible — but "tell me about a failure" exists precisely to see this, and dodging it is visible.'},
        {t:'State the poor outcome plainly, then what you changed as a result.', w:'Interviewers trust a candidate who can name a bad outcome without flinching far more than one whose every story succeeded. The learning is the payload; the failure is the setup for it.'},
        {t:'Emphasise the factors outside your control.', w:'Every sentence of mitigation reduces the credibility of the lesson that follows.'},
        {t:'Focus on the quality of your process despite the outcome.', w:'Occasionally valid, but it usually reads as refusing to own the result.'}
      ], a:1, take:'Own the bad outcome plainly. The lesson is what you are selling.' },

    { id:'r5', el:'result',
      stem:'Which Result quietly undermines an otherwise strong STAR answer?',
      opts:[
        {t:'"We cut about a third of the scaffold budget with no increase in findings."', w:'Quantified and bounded. Strong.'},
        {t:'"It saved the company millions and completely transformed how we work."', w:'Unbounded superlatives invite disbelief and a hostile follow-up. An implausible number is worse than no number, because it makes the interviewer doubt everything before it.'},
        {t:'"Eleven circuits moved to risk-based intervals."', w:'Specific and verifiable.'},
        {t:'"He has come to me first on grey-area calls ever since."', w:'Unquantified but concrete and credible.'}
      ], a:1, take:'An inflated number costs you the whole answer\'s credibility.' },

    /* --- WHOLE --- */
    { id:'w1', el:'whole',
      stem:'Which answer is strongest?',
      opts:[
        {t:'"It was a big shutdown, four hundred contractors, lots going on. We found a problem on a line and had to decide what to do. We talked it through as a team and agreed to add it. It worked out okay."', w:'Three-quarters setup, no owned task, "we" throughout, and a non-result. Every slot fails in the standard way.'},
        {t:'"Two days before a shutdown, a survey found wall loss outside the scope. The call was mine. I modelled three years of records rather than trusting one reading; the rate had doubled after an unflagged process change. I brought the manager two costed options and recommended adding it. We lost half a day — and the wall was thinner than the reading suggested, so leaving it would likely have meant a leak. I now pull trend data before escalating anything."', w:'Tight setup, owned task, first-person action with visible reasoning, quantified result with a counterfactual and a lesson.'},
        {t:'"I was responsible for inspection during a shutdown. I identified an issue, escalated it appropriately, and followed the correct procedure throughout. The outcome was satisfactory."', w:'Correct, first-person, and entirely abstract. No specifics means no evidence — this is a job description, not a story.'},
        {t:'"I found wall loss on a line, modelled the corrosion rate, took options to the manager and we added it to scope. It was the right call."', w:'Genuinely decent and compact — but the Result asserts rightness instead of demonstrating it, and there is no lesson. Good, not strongest.'}
      ], a:1, take:'Specificity is evidence. Abstraction is a job description.' },

    { id:'w2', el:'whole',
      stem:'An answer spends 20 seconds on Situation, 5 on Task, 15 on Action and 5 on Result. What is the main problem?',
      opts:[
        {t:'The Task is too short.', w:'Five seconds can state ownership adequately.'},
        {t:'The weighting is inverted — most time goes to the parts that demonstrate nothing.', w:'Situation takes more airtime than Action, and Result gets least of all. The two assessable slots share less than half the answer. This is the signature STAR failure.'},
        {t:'The answer is too short overall.', w:'Forty-five seconds is a perfectly reasonable length. The distribution is the fault.'},
        {t:'The Result is too short.', w:'It is too short — but it is a symptom of the same weighting problem.'}
      ], a:1, take:'Watch the clock: if setup beats Action, the answer has failed.' },

    { id:'w3', el:'whole',
      stem:'Scrambled. Which order is STAR?\n(1) "I modelled three years of readings rather than trusting the single data point."\n(2) "As responsible engineer, the decision to add it to scope was mine."\n(3) "We lost half a day, and the wall proved thinner than the reading suggested."\n(4) "Two days before the shutdown, a survey found wall loss outside the scope."',
      opts:[
        {t:'4 → 2 → 1 → 3', w:'Scene, ownership, what you did, what happened. Correct.'},
        {t:'4 → 1 → 2 → 3', w:'Action before Task, so you describe doing something before establishing it was yours to do.'},
        {t:'2 → 4 → 1 → 3', w:'Ownership before scene — the listener hears you owned a decision before knowing what about.'},
        {t:'4 → 2 → 3 → 1', w:'Result before Action, which leaves the answer ending on method rather than outcome.'}
      ], a:0, take:'Scene, ownership, your move, the outcome.' },

    { id:'w4', el:'whole',
      stem:'Which is NOT a STAR answer, despite sounding polished?',
      opts:[
        {t:'"A survey found wall loss outside scope. The call was mine. I modelled the trend and recommended adding it. We lost half a day but avoided a likely leak."', w:'Complete STAR in four sentences.'},
        {t:'"I believe strongly in evidence-based decisions. When data is ambiguous I always model the trend rather than react to single readings, and I bring options rather than problems to managers."', w:'A statement of philosophy, not a story. There is no specific occasion, no outcome, and nothing that happened — so nothing can be verified. Confident generalities are the most common STAR substitute.'},
        {t:'"During a shutdown I had to decide on an out-of-scope line. I pulled the records, found the rate had doubled, recommended adding it, and we found it was thinner than expected."', w:'Compressed but complete.'},
        {t:'"I disagreed with a contractor on re-radiography. I owned the acceptance. I asked his reasoning first, found a superseded procedure, and agreed a partial re-shoot. It was accepted that shift."', w:'STAR, cleanly executed.'}
      ], a:1, take:'"I always…" is philosophy. "That Tuesday…" is evidence.' },

    { id:'w5', el:'whole',
      stem:'What should you do if you realise mid-answer that your Situation has run too long?',
      opts:[
        {t:'Finish the setup properly, then speed up the rest.', w:'Compressing the assessable parts to protect the setup is exactly backwards.'},
        {t:'Cut to the action explicitly: "—anyway, the decision was mine, and what I did was…"', w:'A visible self-correction costs a second and recovers the whole answer. Interviewers read it as self-awareness, not as fumbling.'},
        {t:'Apologise for the long introduction.', w:'The apology spends more time and draws attention to the flaw.'},
        {t:'Ask the interviewer if they want more context.', w:'Handing the steering wheel over mid-answer reads as uncertainty.'}
      ], a:1, take:'Cut to the action out loud. It reads as control.' },

    { id:'w6', el:'whole',
      stem:'"Tell me about a time you failed." Which structure is strongest?',
      opts:[
        {t:'Choose a failure that was really a success in disguise.', w:'Interviewers have heard "my weakness is perfectionism" a thousand times. A disguised success answers a different question and signals evasion.'},
        {t:'Full STAR on a genuine failure, with the heaviest weight on Action and the lesson.', w:'The framework does not change — a real failure, what you actually did, the honest outcome, and what changed in your practice. The lesson is the payload.'},
        {t:'Describe the failure but attribute it to circumstances.', w:'Mitigation undermines the credibility the admission was supposed to buy.'},
        {t:'Keep it brief and move on quickly.', w:'Rushing signals discomfort and wastes a question designed to let you show self-awareness.'}
      ], a:1, take:'Real failure, honest outcome, changed practice. No disguises.' },

    { id:'w7', el:'whole',
      stem:'All four are complete STAR answers. Which is strongest?',
      opts:[
        {t:'One where you followed procedure correctly and the outcome was fine.', w:'Compliance with a good outcome shows reliability but no judgement — there was no fork in the road.'},
        {t:'One where you faced a genuine fork, chose against the easier option for a stated reason, and the outcome validated it.', w:'A real decision point, visible reasoning, and a result that tests the reasoning. That combination is the most assessable evidence you can offer.'},
        {t:'One with the largest quantified result.', w:'Size impresses briefly, but a huge result from a decision you did not make demonstrates less than a modest one you did.'},
        {t:'One involving the most senior stakeholders.', w:'Proximity to seniority is not the same as exercising judgement.'}
      ], a:1, take:'The best STAR story has a fork in it — and you explain the turn.' },

    { id:'w8', el:'whole',
      stem:'Why is STAR the right framework for a promotion case, not just interviews?',
      opts:[
        {t:'Because promotion panels expect a formal structure.', w:'They expect evidence; the structure is just how you deliver it.'},

const CH_BADNEWS = {

    `Say it early, say it clearly, and then do the work. The Plan is what separates bad news from a wound: news with a plan is a situation being handled, and news without one is just damage delivered by a messenger. The Support slot is what keeps you human while you do it.`

const CH_AIDA = {
  id:'aida', n:9,

  subtitle:'Attention → Interest → Desire → Action',
  blurb:'How a good idea actually gets adopted instead of merely understood.',
  idea:[
    `AIDA comes from advertising, and technical people often recoil from it for exactly that reason. It is worth confronting that directly: the framework is not a trick. It is the order in which people actually decide — you earn attention, establish relevance, create genuine want, then ask.`,
    `Used on something you do not believe in, that is manipulation. Used on something you do believe in, it is the difference between a good idea being adopted and a good idea being politely ignored. The engineers whose proposals go nowhere are rarely wrong; they are usually just stopping two slots early.`,
    `Because that is the analytical failure mode: you get attention, you establish interest, you explain thoroughly — and then you stop, assuming a sound case sells itself. It does not. Desire and Action are where adoption happens, and they are the two slots that feel least comfortable to people trained in rigour.`
  ],

  weakStrong:{

/* ============================================================
   Chapter 10 — Impromptu (ABT)
   ============================================================ */
const CH_ABT = {
  id:'abt', n:10,
  title:'Impromptu (ABT)',
  subtitle:'And → But → Therefore',
  blurb:'A shape you can start speaking into before you know how it ends.',
  idea:[
    `The terror of being asked something unexpectedly is not the lack of knowledge — it is the lack of a shape. You know things about the topic; what you do not have is an ending, and so you start hedging, listing, and circling until someone rescues you.`,
    `ABT solves this better than any other framework because of one unusual property: you can safely begin speaking before you know your conclusion. Start with what everyone agrees on ("and"), introduce the complication ("but"), and the "therefore" is largely forced by the tension you just created. The structure generates your point rather than requiring you to have it in advance.`,
    `It is also the smallest possible story. A list of true statements is forgettable; the moment you introduce a "but", you have tension, and tension is what makes people listen. Most dull updates are dull because they are all "and".`
  ],
  whenToUse:[
    'A question you were not expecting, in front of people',
    'Being asked for a view with no preparation time',
    'Turning a flat status update into something people listen to',
    'Any moment you need to start talking before you have finished thinking'
  ],
  elements:[
    { name:'And', key:'and', color:'var(--teal)',
      job:'State the uncontested ground — what is true and agreed.',
      fail:'Classic failure: making this the whole answer. A string of "ands" is a list, and lists have no tension, so nobody remembers them. The second failure is taking too long here while you think.' },
    { name:'But', key:'but', color:'var(--orange)',
      job:'Introduce the single complication that makes this interesting.',
      fail:'Classic failure: no "but" at all, leaving an inert summary. The other failure is several buts — each one resets the tension, and the answer becomes a tangle rather than a turn.' },
    { name:'Therefore', key:'therefore', color:'var(--gold)',
      job:'State what follows from the tension — the consequence, view or action.',
      fail:'Classic failure: trailing off without resolving, which wastes the tension you built. Or a "therefore" that does not actually follow from the "but", which listeners notice even when they cannot name why.' }
  ],
  examples:[
    { label:'Unexpected question in a meeting', prompt:'"What do you make of the new inspection contractor?"',
      lines:[
        {el:'And', c:'var(--teal)', t:'Their technical work has been solid — the reporting is clean and they have hit every scheduled date so far.'},
        {el:'But', c:'var(--orange)', t:'They are still working to a procedure revision we superseded last year, and nobody caught it until I checked a report last week.'},
        {el:'Therefore', c:'var(--gold)', t:'So I would keep them, but I want a documented procedure alignment before the next campaign rather than assuming it.'}
      ]},
    { label:'Turning a flat update into something people hear', prompt:'"Anything from integrity this week?"',
      lines:[
        {el:'And', c:'var(--teal)', t:'The campaign is on schedule and we have closed eleven of the fourteen circuits.'},
        {el:'But', c:'var(--orange)', t:'The three outstanding ones are all the ones needing scaffold, and scaffold is the thing that has slipped in every campaign for two years.'},
        {el:'Therefore', c:'var(--gold)', t:'So I would rather we stopped treating access as a detail of the plan and started treating it as the plan — I will bring a proposal next week.'}
      ]},
    { label:'Asked for a view you have not formed', prompt:'"Do you think we should bring inspection in-house?"',
      lines:[
        {el:'And', c:'var(--teal)', t:'In-house would give us continuity, and continuity is most of what makes inspection judgement good — you need to have seen the equipment before.'},
        {el:'But', c:'var(--orange)', t:'We would be hiring into a market where the experienced people are all already placed, so realistically we would be building that continuity from scratch over several years.'},
        {el:'Therefore', c:'var(--gold)', t:'So I would say yes in principle and only if we are honest that it is a five-year play rather than a cost decision for this budget round.'}
      ]},
    { label:'Outside work', prompt:'"How is the house move going?"',
      lines:[
        {el:'And', c:'var(--teal)', t:'We found a place we both like and the survey came back clean.'},
        {el:'But', c:'var(--orange)', t:'The chain below us has a buyer whose mortgage is not confirmed.'},
        {el:'Therefore', c:'var(--gold)', t:'So we are proceeding but not packing — and I have told the agent we will not wait past November.'}
      ]}
  ],
  weakStrong:{
    prompt:'"What do you make of the new inspection contractor?" — asked with no warning.',
    weak:'Um, well, they have been okay I think. The reporting has been good, and they have been on time mostly, and the guys on site seem happy enough with them. There was a bit of a thing with a procedure at one point, and obviously they are still bedding in. So, yeah, fine overall I would say. Early days really.',
    weakWhy:'All "and". Four true statements with no tension, so nothing lands and no view is offered. The one genuinely interesting fact — the procedure problem — is buried mid-list and immediately excused, and the answer ends by retreating from having any opinion at all.',
    strong:'Their technical work has been solid — clean reporting, every date hit. But they are still working to a procedure revision we superseded last year, and nobody caught it until I checked a report last week. So I would keep them, and I want a documented procedure alignment before the next campaign rather than assuming it.',
    strongWhy:'Genuine credit, one sharp complication that carries real information, and a view that follows directly from the tension. Three sentences, no preparation, and the speaker sounds like someone who has thought about it.'
  },
  questions:[
    /* --- AND --- */
    { id:'an1', el:'and', check:true,
      stem:'What is the "And" slot for?',
      opts:[
        {t:'Warming up while you think of an answer.', w:'It does buy a few seconds, but treating it as filler makes it rambling — and the listener hears the stalling.'},
        {t:'Establishing the uncontested ground the tension will act against.', w:'The "but" only has force if something stable precedes it. The And is the platform the turn is made from.'},
        {t:'Listing everything you know about the topic.', w:'A list is exactly what ABT exists to prevent.'},
        {t:'Acknowledging the question politely.', w:'Politeness is fine and is not what the slot does.'}
      ], a:1, take:'The And is the platform. The But needs something to turn against.' },

    { id:'an2', el:'and', check:true,
      stem:'Which "And" is strongest?',
      opts:[
        {t:'"Well, there is a lot to say about them really."', w:'Pure stalling. It establishes nothing and announces that you have not thought about it.'},
        {t:'"Their technical work has been solid — clean reporting, every date hit."', w:'Specific, generous and genuinely uncontested. It also earns you credibility for the criticism that follows.'},
        {t:'"They have been okay I suppose."', w:'Hedged and vague, so the platform is soft and the turn will have nothing to push against.'},
        {t:'"They are a large contractor with a good industry reputation."', w:'True and generic. It is about their category rather than your experience of them.'}
      ], a:1, take:'Make the And specific and genuinely true. It earns the But.' },

    { id:'an3', el:'and', check:true,
      stem:'Why does starting with genuine credit strengthen the criticism that follows?',
      opts:[
        {t:'It softens the blow so people are less defensive.', w:'That is the compliment-sandwich theory, and it treats the And as a social cushion rather than a structural element.'},
        {t:'It establishes you as fair, so the complication reads as judgement rather than as grievance.', w:'A criticism from someone who just acknowledged the strengths is heard as assessment. The same criticism standing alone is heard as a complaint — and complaints are discounted.'},
        {t:'It gives you time to think.', w:'A side benefit, not the mechanism.'},
        {t:'It is more polite.', w:'Politeness is not why it works.'}

    { id:'an4', el:'and', check:true,
      stem:'How long should the And be?',
      opts:[
        {t:'As long as it takes to cover the background properly.', w:'Background coverage is how the And becomes the whole answer.'},
        {t:'One sentence, usually — just enough to set the platform.', w:'A single specific sentence is almost always enough, and keeping it short leaves the tension and the resolution room to land.'},
        {t:'About half the answer.', w:'Half your airtime on uncontested ground means the interesting part gets a quarter.'},
        {t:'It can be skipped if you are short of time.', w:'Skip it and the But has nothing to turn against — you open on a complication nobody has context for.'}

    { id:'an5', el:'and',
      stem:'You genuinely disagree with the premise of the question. What should the And be?',

        {t:'Challenge the premise immediately instead.', w:'Sometimes necessary, and opening on a challenge usually costs you the room before you have made your case.'},
        {t:'Find the part of the premise you do accept, state that, then turn on the part you do not.', w:'"It is true that the fixed-interval approach has served us safely for years — but it has done so by opening equipment that never needed opening." You have been honest, kept the shared ground, and the disagreement becomes a turn rather than a confrontation.'},
        {t:'Answer the question as asked and raise your disagreement later.', w:'Later usually means never, and you will have implicitly endorsed the premise.'},
        {t:'State that you disagree with the question before answering.', w:'Meta-commentary about the question delays your actual view and sounds combative.'}
      ], a:1, take:'Accept the true part, then turn. Disagreement lands better as a But.' },

    { id:'an6', el:'and',
      stem:'Which is the subtlest "And" failure?',
      opts:[
        {t:'Making it too long.', w:'The most common failure and easy to hear.'},
        {t:'Offering credit you do not mean, to be diplomatic.', w:'Hollow praise is detectable, and once the listener senses it they discount everything after — including the genuine complication. The insincere And poisons the whole answer while feeling like good manners.'},
        {t:'Being too specific.', w:'Specificity is a virtue here.'},
        {t:'Starting with "well".', w:'A verbal tic, not a structural problem.'}

    /* --- BUT --- */
    { id:'bu1', el:'but', check:true,
      stem:'What does the "But" do?',
      opts:[
        {t:'Introduces the single complication that makes the topic interesting.', w:'It is the engine of the whole shape. Tension is what converts information into something worth listening to.'},
        {t:'Balances the positives with negatives for fairness.', w:'Balance is not the goal — a turn is. This framing produces a pros-and-cons list rather than a point.'},
        {t:'Signals that you are about to disagree.', w:'Sometimes, and its function is structural rather than social.'},
        {t:'Adds a caveat to protect you if you are wrong.', w:'Using the But as a hedge is precisely how it loses its force.'}
      ], a:0, take:'The But is the engine. No tension, no attention.' },

    { id:'bu2', el:'but', check:true,
      stem:'Why is a single "But" better than several?',
      opts:[
        {t:'It is quicker.', w:'Speed is a side effect.'},
        {t:'Each additional one resets the tension, so the answer becomes a tangle with no clear turn.', w:'Tension only works if it points somewhere. Two complications leave the listener unsure which one the "therefore" resolves, and the answer stops being a story.'},
        {t:'Multiple buts sound negative.', w:'Tone is not the issue; structure is.'},
        {t:'It makes you sound more decisive.', w:'A consequence, not the reason.'}

    { id:'bu4', el:'but', check:true,

        {t:'It reassures everyone that things are going well.', w:'Occasionally, and mostly it does not register at all.'},

const CHAPTERS = [CH_PREP, CH_THREE, CH_SELFINTRO, CH_ONEPOINT, CH_STAR, CH_STAKE, CH_BADNEWS, CH_TECH,
                  CH_AIDA, CH_ABT, CH_QA, CH_EXEC];
const COMING = [];

/* ============================================================
   STATE — localStorage only, never transmitted
   ============================================================ */
const STORE = 'framework-school-v1';
const PASS_MARK = 0.9;      // mastery exam threshold
const EXAM_LEN  = 12;       // questions in the mastery exam
const REVIEW_SLOTS = 3;     // exam slots reserved for earlier mastered chapters

// Question ids must be globally unique (exams mix chapters), and each question
// remembers which chapter owns it so misses are tracked against the right one.
CHAPTERS.forEach(c => c.questions.forEach(q => {
  if (q.id.indexOf(c.id + '-') !== 0) q.id = c.id + '-' + q.id;
  q._ch = c.id;
}));

// Chapters are written to build in order, but nothing is gated.
// Progress lives in localStorage per browser, so a device that has not seen your
// earlier work must still let you open whatever chapter you were actually on.
// Flip GATED to true to restore strict sequential unlocking.
const GATED = false;
function unlockedCh(c){
  if (!GATED) return true;
  const i = CHAPTERS.findIndex(x => x.id === c.id);
  return i === 0 || P(CHAPTERS[i-1].id).mastered;
}

let S = loadState();
function blankChapter(){ return { read:false, checks:{}, drills:{n:0,ok:0}, missed:{}, mastered:false, examBest:0 }; }
function loadState(){
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch(e){ raw = {}; }
  const s = { ch: {} };
  CHAPTERS.forEach(c => { s.ch[c.id] = Object.assign(blankChapter(), (raw.ch && raw.ch[c.id]) || {}); });
  return s;
}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e){} }
function P(id){ return S.ch[id] || (S.ch[id] = blankChapter()); }

/* ============================================================
   HELPERS
   ============================================================ */
const $ = sel => document.querySelector(sel);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function chapter(id){ return CHAPTERS.find(c=>c.id===id); }
function elementsOf(c){ return c.elements.map(e=>e.name.toLowerCase().split(' ')[0]); }
function qsFor(c, el){ return c.questions.filter(q => q.el === el); }
function checkQs(c, el){ return c.questions.filter(q => q.el === el && q.check); }
function chapterDone(c){
  const p = P(c.id);
  const allChecks = c.elements.every(e => p.checks[e.key]);
  return p.read && allChecks && p.mastered;
}
function stagesDone(c){
  const p = P(c.id);
  let n = 0;
  if (p.read) n++;
  c.elements.forEach(e => { if (p.checks[e.key]) n++; });
  if (p.drills.n >= 10) n++;
  if (p.mastered) n++;
  return n;
}
function stagesTotal(c){ return 1 + c.elements.length + 1 + 1; }

/* ============================================================
   ROUTER
   ============================================================ */
let VIEW = { name:'home' };
function go(name, opts){ VIEW = Object.assign({name}, opts||{}); render(); window.scrollTo(0,0); }
function render(){
  $('#homeBtn').style.display = VIEW.name === 'home' ? 'none' : 'inline-flex';
  const v = VIEW.name;
  if (v === 'home')     return renderHome();
  if (v === 'chapter')  return renderChapter(VIEW.id);
  if (v === 'read')     return renderRead(VIEW.id);
  if (v === 'quiz')     return renderQuiz();
  if (v === 'result')   return renderResult();
  renderHome();
}

  const nextIdx = started !== -1 ? started : CHAPTERS.findIndex(c => !P(c.id).mastered);

  const rows = CHAPTERS.map((c, i) => {

/* ============================================================
   QUIZ ENGINE
   mode: 'check' (must get all right) | 'drill' (endless, miss-weighted) | 'exam'
   ============================================================ */
let Q = null;

function startQuiz(id, mode, el){
  const c = chapter(id), p = P(id);
  let queue = [];
  if (mode === 'check'){
    const name = c.elements.find(e => e.key === el).name;
    queue = shuffle(checkQs(c, el));
    Q = { id, mode, el, elName:name, queue, i:0, ok:0, asked:0, requeue:[], answered:false, picked:-1, order:null };
  } else if (mode === 'drill'){
    queue = buildDrillQueue(c, p, 8);
    Q = { id, mode, queue, i:0, ok:0, asked:0, requeue:[], answered:false, picked:-1, order:null };
  } else {
    queue = buildExamQueue(c);
    Q = { id, mode, queue, i:0, ok:0, asked:0, requeue:[], answered:false, picked:-1, order:null };
  }
  go('quiz');
}

// Drills bias toward questions previously missed.
function buildDrillQueue(c, p, n){
  const missed = c.questions.filter(q => (p.missed[q.id]||0) > 0);
  const rest   = c.questions.filter(q => !(p.missed[q.id]||0));
  const pick   = shuffle(missed).slice(0, Math.min(missed.length, Math.ceil(n/2)))
                 .concat(shuffle(rest));
  return pick.slice(0, n);
}
// Exam samples across every element so it cannot be gamed — and, once you have
// mastered earlier chapters, mixes a few of their questions back in. Mastery that
// decays is not mastery, so old frameworks keep resurfacing.
function buildExamQueue(c){
  const idx = CHAPTERS.findIndex(x => x.id === c.id);
  const earlier = CHAPTERS.slice(0, idx).filter(x => P(x.id).mastered);
  const reviewN = earlier.length ? REVIEW_SLOTS : 0;
  const ownN = EXAM_LEN - reviewN;

  // Guarantee at least one question per element, then fill from the whole bank.
  let own = [];
  c.elements.forEach(e => { own = own.concat(shuffle(qsFor(c, e.key)).slice(0, 1)); });
  const rest = shuffle(c.questions.filter(q => own.indexOf(q) === -1));
  own = shuffle(own.concat(rest).slice(0, ownN));

  let pool = [];
  earlier.forEach(x => { pool = pool.concat(x.questions); });
  const review = shuffle(pool).slice(0, reviewN);
  return shuffle(own.concat(review));
}

function renderQuiz(){
  const c = chapter(Q.id);
  const q = Q.queue[Q.i];
  if (!q) return finishQuiz();

  // Randomise option order per question so answer position can't be memorised.
  if (!Q.order) Q.order = shuffle(q.opts.map((_,i)=>i));
  const order = Q.order;

  const title = Q.mode==='check' ? `Check · ${esc(Q.elName)}`
              : Q.mode==='exam'  ? 'Mastery exam' : 'Practice drill';
  const counter = Q.mode==='drill'
      ? `${Q.asked+1} · ${Q.ok}/${Q.asked} correct`
      : `${Q.i+1} of ${Q.queue.length}${Q.requeue.length?` (+${Q.requeue.length} to retry)`:''}`;

  const opts = order.map((origIdx, shownIdx) => {
    const o = q.opts[origIdx];
    const isAns = origIdx === q.a;
    let cls = '', mark = '';
    if (Q.answered){
      if (isAns){ cls='correct'; mark='<span class="mk">Correct</span><br>'; }
      else if (shownIdx === Q.picked){ cls='wrong'; mark='<span class="mk">Your answer</span><br>'; }
    }
    return `<button class="opt ${cls}" ${Q.answered?'disabled':''} onclick="answer(${shownIdx})">
      ${mark}${esc(o.t)}
      ${Q.answered ? `<span class="why">${esc(o.w)}</span>` : ''}
    </button>`;
  }).join('');

  $('#app').innerHTML = `
    <div class="qmeta"><span>${title}</span><span>${counter}</span></div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:${q.passage?'12px':'14px'}">${nl(q.stem)}</div>
      ${q.passage?`<div class="passage">${nl(q.passage)}</div>`:''}
      ${opts}
      ${Q.answered && q.take ? `<div class="take"><b>Takeaway:</b> ${esc(q.take)}</div>` : ''}
    </div>
    ${Q.answered ? `<button class="btn btn-p btn-full" onclick="nextQ()">${nextLabel()}</button>` : ''}
    <button class="btn btn-g btn-full" style="margin-top:8px" onclick="quitQuiz()">Leave</button>
  `;
}
function nextLabel(){
  if (Q.mode==='drill') return 'Next question';
  const last = Q.i >= Q.queue.length-1;
  if (!last) return 'Next question';
  return Q.requeue.length ? 'Retry the ones you missed' : 'See result';
}

function answer(shownIdx){
  if (Q.answered) return;
  const q = Q.queue[Q.i];
  const origIdx = Q.order[shownIdx];
  const correct = origIdx === q.a;
  const p = P(Q.id);
  const owner = P(q._ch || Q.id);   // review questions belong to their own chapter

  Q.answered = true; Q.picked = shownIdx; Q.asked++;
  if (correct){
    Q.ok++;
    if (owner.missed[q.id]) owner.missed[q.id]--;
  } else {
    owner.missed[q.id] = (owner.missed[q.id]||0) + 1;
    if (Q.mode === 'check') Q.requeue.push(q);   // "until you get all of it"
  }
  if (Q.mode === 'drill'){ p.drills.n++; if (correct) p.drills.ok++; }
  save();
  renderQuiz();
}

function nextQ(){
  Q.answered = false; Q.picked = -1; Q.order = null;
  if (Q.mode === 'drill'){
    Q.i++;
    if (Q.i >= Q.queue.length){ // keep going endlessly
      Q.queue = Q.queue.concat(buildDrillQueue(chapter(Q.id), P(Q.id), 8));
    }
    return renderQuiz();
  }
  Q.i++;
  if (Q.i >= Q.queue.length){
    if (Q.requeue.length){          // check mode: redo missed until clean
      Q.queue = shuffle(Q.requeue); Q.requeue = []; Q.i = 0;
      return renderQuiz();
    }
    return finishQuiz();
  }
  renderQuiz();
}
function quitQuiz(){ const id = Q.id; Q = null; go('chapter',{id}); }

function finishQuiz(){
  const id = Q.id, p = P(id), c = chapter(id);
  if (Q.mode === 'check'){
    p.checks[Q.el] = true;                       // only reachable once all are right
  } else if (Q.mode === 'exam'){
    const pct = Math.round(Q.ok / Q.queue.length * 100);
    p.examBest = Math.max(p.examBest||0, pct);
    if (Q.ok / Q.queue.length >= PASS_MARK) p.mastered = true;
    VIEW.pct = pct;
  }
  save();
  go('result', { id, mode:Q.mode, ok:Q.ok, total:Q.queue.length, el:Q.elName });
}

function renderResult(){
  const { id, mode, ok, total, el } = VIEW;
  const p = P(id);
  const pct = total ? Math.round(ok/total*100) : 0;
  let head, body, tone;

  if (mode === 'check'){
    head = 'Element check passed';
    tone = 'var(--green)';
    body = `You answered every ${esc(el)} question correctly — including the ones you had to come back to. That is the bar.`;
  } else if (mode === 'exam'){
    const passed = p.mastered && pct >= Math.round(PASS_MARK*100);
    head = passed ? 'Mastery exam passed' : 'Not yet';
    tone = passed ? 'var(--green)' : 'var(--orange)';
    body = passed
      ? 'You have PREP. Keep it warm with drills — and it will keep resurfacing inside later chapters so it does not fade.'
      : `You need ${Math.round(PASS_MARK*100)}% to pass. Run some drills — the questions you missed will come back more often — then sit it again.`;
  } else {
    head = 'Drill session';
    tone = 'var(--teal)';
    body = 'Every question you missed is now weighted to return sooner. That is how it sticks.';
  }

  $('#app').innerHTML = `
    <div class="card center" style="padding:28px 18px">
      <div class="big" style="color:${tone}">${mode==='check' ? '✓' : pct + '%'}</div>
      <h2 style="margin:6px 0 8px">${esc(head)}</h2>
      <p class="muted" style="margin-bottom:0">${esc(body)}</p>
      ${mode!=='check' ? `<p class="tiny muted" style="margin-top:10px">${ok} of ${total} correct</p>` : ''}
    </div>
    <div class="row">
      <button class="btn btn-s" style="flex:1" onclick="go('chapter',{id:'${id}'})">Back to chapter</button>
      ${mode==='exam' && !p.mastered ? `<button class="btn btn-p" style="flex:1" onclick="startQuiz('${id}','drill')">Drill now</button>` : ''}
      ${mode==='drill' ? `<button class="btn btn-p" style="flex:1" onclick="startQuiz('${id}','drill')">Keep drilling</button>` : ''}
    </div>
  `;
}

render();
</script>
</body>
</html>
